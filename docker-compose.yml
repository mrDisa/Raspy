services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: raspy
      POSTGRES_USER: raspy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://raspy:${POSTGRES_PASSWORD}@postgres:5432/raspy?sslmode=disable
      BOT_TOKEN: ${BOT_TOKEN}
    depends_on:
      - postgres
    networks:
      - internal
  xray:
    image: teddysun/xray
    restart: unless-stopped
    ports:
      - "1080:1080"
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    networks:
      - internal
    entrypoint: ["xray"]
    command: ["run", "-config", "/etc/xray/config.json"]
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      WEB_APP_URL: ${WEB_APP_URL}
      BACKEND_URL: http://backend:3000
      PROXY_URL: socks5://xray:1080
    depends_on:
      - backend
      - xray
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    networks:
      - internal

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  internal:

volumes:
  postgres_data:
  certbot_www:
  certbot_certs:
